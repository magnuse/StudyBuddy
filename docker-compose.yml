services:
  bot:
    image: ghcr.io/magnuse/studybuddy-base:latest   # Python + Tesseract; rarely changes
    env_file: .env
    environment:
      TZ: Europe/Stockholm
      GIT_REPO: git@github.com:magnuse/StudyBuddy.git
      GIT_BRANCH: stable          # only tested code reaches this branch
    volumes:
      - /mnt/user/appdata/studybuddy/data:/app/data        # database, backups
      - /mnt/user/appdata/studybuddy/code:/app/code        # pulled code + Python packages
      - /mnt/user/appdata/studybuddy/deploy_key:/run/deploy_key:ro
      - /mnt/user/appdata/studybuddy/config.yaml:/app/config.yaml:ro
    restart: unless-stopped       # a restart is also how it updates
    depends_on: [ollama]

  ollama:
    image: ollama/ollama:latest
    volumes:
      - /mnt/user/appdata/ollama:/root/.ollama
    restart: unless-stopped
